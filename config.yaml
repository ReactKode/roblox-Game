agent:
  name: NexusAgent
  version: "2.0.0"
  data_dir: "./data"
  max_iterations: 12   # ReAct loop cap per task

models:
  # Tries in order: preferred → ollama → lmstudio → openai → anthropic
  preferred_backend: "auto"
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3.2"              # or: mistral, codellama, qwen2.5-coder, etc.
    embed_model: "nomic-embed-text" # pull with: ollama pull nomic-embed-text
  lmstudio:
    base_url: "http://localhost:1234/v1"
    model: "local-model"
  openai:
    model: "gpt-4o-mini"
  anthropic:
    model: "claude-sonnet-4-6"

memory:
  short_term_limit: 20
  long_term_backend: "auto"      # auto → tries chromadb first, falls back to json+tfidf

heartbeat:
  enabled: true
  interval: 300                  # seconds (5 minutes)

tools:
  web_search_enabled: true
  code_execution_enabled: true
  code_execution_timeout: 30
  max_search_results: 5

skills:
  skill_dir: "./data/skills"

# ── Scheduler ──────────────────────────────────────────────────────────────
# Requires: pip install apscheduler
scheduler:
  enabled: true

# ── Sandbox ────────────────────────────────────────────────────────────────
# backend: local | docker | ssh
# docker requires: pip install docker
# ssh requires: pip install paramiko
sandbox:
  backend: "local"
  docker_image: "python:3.11-slim"
  memory_limit: "256m"
  network_disabled: true
  # ssh backend settings (ignored when backend != 'ssh'):
  # host: "remote.example.com"
  # port: 22
  # username: "user"
  # key_path: "~/.ssh/id_rsa"

# ── Gateways ───────────────────────────────────────────────────────────────
# Set enabled: true and fill in credentials to activate each gateway.
# Requires pip packages per platform.
gateway:
  telegram:
    enabled: false
    token: ""                   # from @BotFather
    allowed_users: []           # list of Telegram user IDs (strings); empty = allow all
    # pip install python-telegram-bot

  discord:
    enabled: false
    token: ""                   # Discord bot token
    allowed_guilds: []          # list of guild IDs (integers); empty = allow all
    # pip install discord.py

  slack:
    enabled: false
    bot_token: ""               # xoxb-... Bot User OAuth Token
    app_token: ""               # xapp-... App-Level Token (Socket Mode)
    # pip install slack-bolt

  email:
    enabled: false
    imap_host: ""               # e.g. imap.gmail.com
    imap_port: 993
    smtp_host: ""               # e.g. smtp.gmail.com
    smtp_port: 465
    username: ""
    password: ""                # use App Password for Gmail
    poll_interval: 60           # seconds between inbox checks
    allowed_senders: []         # list of email addresses; empty = allow all

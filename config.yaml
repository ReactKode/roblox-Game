agent:
  name: NexusAgent
  version: "1.0.0"
  data_dir: "./data"

models:
  # auto tries: ollama → lmstudio → openai → anthropic
  preferred_backend: "auto"
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3.2"
    embed_model: "nomic-embed-text"
  lmstudio:
    base_url: "http://localhost:1234/v1"
    model: "local-model"
  openai:
    model: "gpt-4o-mini"
  anthropic:
    model: "claude-sonnet-4-6"

memory:
  short_term_limit: 20
  long_term_backend: "chromadb"   # chromadb | json
  consolidation_interval: 300      # seconds

heartbeat:
  enabled: true
  interval: 300   # seconds between beats

tools:
  web_search_enabled: true
  code_execution_enabled: true
  code_execution_timeout: 30
  max_search_results: 5

skills:
  auto_learn: true
  skill_dir: "./data/skills"
